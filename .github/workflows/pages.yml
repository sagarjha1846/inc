name: Deploy site

# Publishes the static shop window: the landing page, a full sample report,
# both paid report formats, and the install line. The live audit endpoint is
# deliberately absent — auditing a URL needs a server-side fetch, which a
# static host cannot do and a browser is blocked from doing by CORS. For the
# working web UI, deploy the Worker (see docs/DEPLOY.md).
#
# Publishing is a plain git push to the `gh-pages` branch rather than the Pages
# deployment API. The API route needs a token that can *create* a Pages site,
# which the default workflow token is not granted here, and it fails with
# "Resource not accessible by integration". A branch push only needs
# `contents: write`, and GitHub serves the branch once Pages is pointed at it.

on:
  push:
    branches:
      - main
      - claude/monetizable-project-ideas-o45uuc
    paths:
      - 'src/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the static site
        run: node scripts/build-site.mjs site

      - name: Verify the build is complete and self-contained
        run: |
          set -e
          for f in index.html demo.html sample-report.html sample-site-report.html robots.txt sitemap.xml llms.txt .nojekyll; do
            test -f "site/$f" || { echo "missing site/$f"; exit 1; }
          done
          # A dead buy button or a leaked fixture host would both be visible to
          # every visitor, so fail rather than publish them.
          ! grep -q "CHANGE-ME" site/index.html || { echo "placeholder link in landing page"; exit 1; }
          ! grep -rq "127\.0\.0\.1" site/ || { echo "fixture host leaked into the site"; exit 1; }
          echo "site build verified"

      - name: Publish to the gh-pages branch
        run: |
          set -e
          # Build the commit from the site directory alone, with no history, so
          # the published branch never accumulates weight or leaks source.
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          # The identity is passed inline: this is a brand-new repository and
          # inherits nothing from the checked-out one, so a `git config` in the
          # parent directory leaves the commit with no author and git exits 128.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "published to gh-pages"
