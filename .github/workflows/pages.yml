name: Deploy site

# Publishes the static shop window to GitHub Pages: the landing page, a full
# sample report, and the install instructions. The live audit endpoint is not
# part of it — auditing a URL needs a server-side fetch, which a static host
# cannot do and a browser is blocked from doing by CORS. For the working web
# UI, deploy the Worker (see docs/DEPLOY.md).
#
# `configure-pages` with enablement: true turns Pages on via the API, so this
# needs no manual setting change. If the repository or plan does not permit it,
# that step fails loudly rather than deploying something broken.

on:
  push:
    branches:
      - main
      - claude/monetizable-project-ideas-o45uuc
    paths:
      - 'src/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never leave a half-published site: let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the static site
        run: node scripts/build-site.mjs site

      - name: Verify the build is complete and self-contained
        run: |
          set -e
          for f in index.html demo.html sample-report.html sample-site-report.html robots.txt llms.txt .nojekyll; do
            test -f "site/$f" || { echo "missing site/$f"; exit 1; }
          done
          # A dead buy button or a leaked fixture host would both be visible to
          # every visitor, so fail the deploy rather than publish them.
          ! grep -q "CHANGE-ME" site/index.html || { echo "placeholder link in landing page"; exit 1; }
          ! grep -rq "127\.0\.0\.1" site/ || { echo "fixture host leaked into the site"; exit 1; }
          echo "site build verified"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
